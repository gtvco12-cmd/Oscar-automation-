name: Blog Automation

on:
  schedule:
    - cron: '0 9 * * *' # Runs automatically every day at 09:00 UTC
  workflow_dispatch: # Allows you to manually trigger it from a phone in the GitHub App

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the updated topics.txt back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Blog Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Commit & Push Updated Topics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topics.txt
          
          # Only commit and push if topics.txt has actually been modified
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: remove processed blog topic" && git push)

